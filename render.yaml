services:
  - type: web
    name: fb-planner-audit
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: META_TOKEN
        sync: false
      - key: QPAY_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RUN_MODE
        value: webhook
      - key: PORT
        value: 10000
