services:
  - type: web
    plan: free
    name: fb-planner-audit
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT bot.app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: META_TOKEN
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: QPAY_CLIENT_ID
        sync: false
      - key: QPAY_CLIENT_SECRET
        sync: false
      - key: QPAY_INVOICE_CODE
        sync: false
      - key: QPAY_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
