    services:
    - type: web
      name: fb-planner-v2
      env: python
      buildCommand: pip install -r requirements.txt
      startCommand: python run.py
      envVars:
              - key: META_TOKEN
          sync: false
              - key: QPAY_KEY
          sync: false
              - key: PYTHON_VERSION
          value: 3.11.0
